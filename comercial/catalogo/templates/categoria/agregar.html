{% extends "base.html" %}

{% block titulo %} Agregar Categoría {% endblock titulo %}

{% block contenido %}
<h1 class="font-bold text-2xl mb-4">Agregar nueva categoría</h1>


<form method="POST" class="max-w-lg bg-white p-6 rounded shadow">
    {% csrf_token %}
    

    <div class="mb-4">
        {{ form.as_p }}
    </div>
    
    <div class="mt-4">
        <button type="submit" class="p-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-bold">Guardar categoría</button>
        <a href="{% url 'list_categoria' %}" class="ml-4 text-red-600 hover:underline">Cancelar</a>
    </div>
</form>
{% endblock contenido %}
